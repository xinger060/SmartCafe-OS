name: "智咖系统"
version: "1.0.6"
slug: smartcafe-server
description: >-
  智咖网吧智能管理系统服务端，终端安全对接Home Assistant。
arch:
  - amd64
url: "https://github.com/xinger060/SmartCafe-OS"
image: "ghcr.io/xinger060/smartcafe-server-{arch}"
startup: services
ingress: true
ingress_port: 8766
panel_icon: "mdi:monitor-dashboard"
panel_title: "智咖系统"
panel_admin: true
boot: auto
init: false
host_network: false
ports:
  8766/tcp: 8766
ports_description:
  8766/tcp: "终端 API 端口"
map:
  - type: data
    read_only: false
options:
  ha_base_url: "http://homeassistant.local:8123"
  ha_username: ""
  ha_password: ""
  token_refresh_time: ""
  # 后台「PC状态」那一列要用它去调 HA 的 /api/pc_manager/status。
  # 原版没有这个配置项，只能在管理界面里设 —— 而 run.sh 每次启动都会把
  # config.json 覆盖掉，所以设了也活不过一次重启。加进 options 才能持久。
  ha_long_lived_token: ""
schema:
  ha_base_url: str
  ha_username: str
  ha_password: password
  token_refresh_time: str
  # password 类型 = 在界面上打码显示，避免令牌被旁人看到
  ha_long_lived_token: password

# ⚠️ 原版这里写着 breaking_versions: ["1.0.4", "1.0.5"]，
#    意思是"从这两个版本过来的更新必须卸载重装"（数据会丢）。
#    1.0.6 修的就是 1.0.5 的问题，所以这里必须留空，
#    否则装的是 1.0.5 的用户根本升不上来，只能卸载重装。
breaking_versions: []

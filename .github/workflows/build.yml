name: Build HA Add-on

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [amd64]
    steps:
      - uses: actions/checkout@v4

      - name: Get version from config.yaml
        id: version
        run: echo "version=$(grep '^version:' smartcafe_server/config.yaml | awk '{print $2}' | tr -d '"')" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./smartcafe_server
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: |
            ghcr.io/xinger060/smartcafe-server-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/xinger060/smartcafe-server-${{ matrix.arch }}:latest
          build-args: |
            BUILD_FROM=${{ matrix.arch == 'aarch64' && 'ghcr.io/home-assistant/aarch64-base:latest' || 'ghcr.io/home-assistant/amd64-base:latest' }}
